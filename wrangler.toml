# Cloudflare Workers config: the site is served as static assets from dist/.
# Workers Builds is connected to this repository: it runs `npm run build`, then
# `npx wrangler deploy`, for production on main and a preview per pull request.
name = "marc-borer-ch"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
# /404.html is served for unknown paths; /path and /path/ both resolve to the folder's index.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Workers Builds runs `npx wrangler preview` for every non-production branch; the
# command requires this table, which may stay empty for a static site.
[previews]
