name: CI

# Cloudflare Workers Builds deploys the site from this repository (production
# from main, a preview per pull request). This workflow only proves that a
# change builds before it lands; it deploys nothing.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from committed lockfile)
        run: npm ci
      - name: Audit dependencies (gate on high/critical)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
