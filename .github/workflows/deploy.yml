name: Build and deploy

# Every push and pull request builds the site. Pushes to main deploy production
# and pull requests from this repository deploy a preview, both through
# `wrangler pages deploy` (Direct Upload) to the Cloudflare Pages project
# `marc-borer-ch`. Dependabot and forks have no secrets, so they only build.
#
# Secrets: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) and
# CLOUDFLARE_ACCOUNT_ID. Optional variable: CF_BEACON_TOKEN (Cloudflare Web
# Analytics site token), when the beacon is not injected by Cloudflare itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from committed lockfile)
        run: npm ci
      - name: Audit dependencies (gate on high/critical)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=marc-borer-ch --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }}
