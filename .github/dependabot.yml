version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      npm:
        patterns:
          - "*"
        exclude-patterns:
          - "astro"
          - "@astrojs/*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    labels:
      - dependencies
